<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cine Sammana | Voting Swiper</title>
    <script>
      (function () {
        var pvcs = "https://suhastpml.github.io/PVCS/";
        var d = "?d=" + new Date().toISOString().slice(0, 10).replace(/-/g, "");
        var h = document.head;

        var swcss = document.createElement("link");
        swcss.rel = "stylesheet";
        swcss.href = "https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css";
        h.appendChild(swcss);

        var css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = pvcs + "styles.css" + d;
        h.appendChild(css);

        [
          pvcs + "data.js" + d,
          pvcs + "voting-data-augment.js" + d,
          pvcs + "app.js" + d,
          "https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js",
          pvcs + "voting-swiper.js" + d
        ].forEach(function (src) {
          var s = document.createElement("script");
          s.src = src;
          s.async = false;
          h.appendChild(s);
        });
      })();
    </script>
  </head>
  <body data-page="voting-swiper">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand-lockup" href="/PVCS">
          <img src="PVCSlogo.svg?v=2" alt="ಪ್ರಜಾವಾಣಿ ಸಿನಿ ಸಮ್ಮಾನ">
        </a>
      </div>
    </header>
    <main class="page-shell voting-swiper-page" data-voting-swiper-root></main>
    <nav class="bottom-nav" aria-label="Primary"><div class="bottom-nav__inner" data-bottom-nav></div></nav>
    <div class="menu-overlay" data-menu-overlay hidden></div>
    <aside class="side-menu" data-side-menu aria-label="Side menu">
      <div class="side-menu__header"><strong>Site Sections</strong><button class="side-menu__close" type="button" data-menu-close aria-label="Close menu">X</button></div>
      <ul data-menu-links></ul>
      <a class="btn btn--ghost" href="/PVCS">Back Home</a>
    </aside>
  </body>
</html>
