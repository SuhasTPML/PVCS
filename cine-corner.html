<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cine Sammana | Cine Corner</title>
    <script>
      (function () {
        var pvcs = "https://suhastpml.github.io/PVCS/";
        var d = "?d=" + new Date().toISOString().slice(0, 10).replace(/-/g, "");
        var h = document.head;
        var css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = pvcs + "styles.css" + d;
        h.appendChild(css);
        ["data.js", "app.js"].forEach(function (f) {
          var s = document.createElement("script");
          s.src = pvcs + f + d;
          s.async = false;
          h.appendChild(s);
        });
      })();
    </script>
  </head>
  <body data-page="cine-corner">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand-lockup" href="/PVCS">
          <img src="PVCSlogo.svg?v=2" alt="ಪ್ರಜಾವಾಣಿ ಸಿನಿ ಸಮ್ಮಾನ">
        </a>
      </div>
    </header>
    <main class="page-shell shell-grid">
      <section class="section-card shell-card">
        <h1>Cine Corner page shell</h1>
        <p>This destination can later link out to the final article, media, or archive experience without changing the navigation system.</p>
        <a class="btn btn--primary" href="/PVCS">Back to Home</a>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="Primary"><div class="bottom-nav__inner" data-bottom-nav></div></nav>
    <div class="menu-overlay" data-menu-overlay hidden></div>
    <aside class="side-menu" data-side-menu aria-label="Side menu">
      <div class="side-menu__header"><strong>Site Sections</strong><button class="side-menu__close" type="button" data-menu-close aria-label="Close menu">X</button></div>
      <ul data-menu-links></ul>
      <a class="btn btn--ghost" href="/PVCS">Back Home</a>
    </aside>
  </body>
</html>
